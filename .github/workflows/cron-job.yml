name: cron-job

on:
  schedule:
    - cron: '0 8 * * *'
  
  workflow_dispatch:
  
jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      URL: ${{ secrets.URL }}
    steps:
      - name: download code
        uses: actions/checkout@v6

      - name: node config
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install and run
        run: |
          npm install
          node script.js
